<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Přednost v jízdě – křižovatky</title>
  </head>
  <body>
    <header id="hud">
      <div class="hud-left">
        <span class="hud-title">Přednost v jízdě</span>
        <span class="hud-sub"><span id="hud-round"></span><span id="hud-type"></span></span>
      </div>
      <div class="hud-stats">
        <span>Zbývá <b id="hud-left">–</b></span>
        <span class="good">Správně <b id="hud-good">0</b></span>
        <span class="bad">Špatně <b id="hud-bad">0</b></span>
        <span id="hud-timer-wrap" class="timer hidden">Čas <b id="hud-timer">0</b></span>
      </div>
      <div class="hud-right">
        <button id="btn-sound" class="hud-btn" type="button" aria-pressed="true">Zvuk: zap.</button>
        <button id="btn-menu" class="hud-btn" type="button">Menu</button>
        <div id="hud-score" class="hud-score" aria-label="Úspěšnost">– %</div>
      </div>
    </header>
    <main>
      <div id="scene-wrap">
        <svg id="scene" viewBox="0 0 1000 1000" role="group" aria-label="Křižovatka při pohledu shora"></svg>
      </div>
      <p id="info" aria-live="polite"></p>
    </main>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-box" class="modal-box">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>
  </body>
</html>
